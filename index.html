<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Austin, miniature</title>
<style>
  :root{ --ink:#3a342c; --dim:#7a7062; --line:rgba(60,50,40,.14); --panel:rgba(250,246,238,.9) }
  html,body{margin:0;height:100%;background:#e9e2d3;overflow:hidden;color:var(--ink);
    font:13px/1.45 ui-sans-serif,-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  #ui{position:fixed;left:16px;bottom:16px;width:268px;padding:12px 13px 11px;
      background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);
      border-radius:12px;box-shadow:0 8px 30px rgba(40,30,20,.14)}
  #ui.hidden{display:none}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.15px}
  .sub{color:var(--dim);font-size:11px;margin:1px 0 9px}
  .row{display:flex;gap:7px;align-items:center;margin:7px 0}
  .row>label{flex:0 0 52px;color:#5c5448;font-size:11.5px}
  input[type=range]{flex:1;min-width:0;accent-color:#5a6b7d;height:16px}
  button{font:inherit;font-size:12px;padding:4px 10px;border-radius:7px;border:1px solid rgba(60,50,40,.22);
    background:#fff;color:var(--ink);cursor:pointer;transition:background .12s,color .12s}
  button:hover{background:#f3ede1}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.sq{padding:4px 9px;min-width:30px}
  .seg{display:flex;gap:0}
  .seg button{border-radius:0;border-right-width:0}
  .seg button:first-child{border-radius:7px 0 0 7px}
  .seg button:last-child{border-radius:0 7px 7px 0;border-right-width:1px}

  #yearBig{display:flex;align-items:baseline;gap:9px;margin:2px 0 4px}
  #yrLabel{font-size:27px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1}
  #eraLabel{color:var(--dim);font-size:11.5px;font-style:italic}
  #count{color:var(--dim);font-size:11px;margin-left:auto;white-space:nowrap}
  .hint{color:#8a8072;font-size:10.5px;margin-top:8px;border-top:1px solid var(--line);padding-top:7px}
  .hint b{font-weight:600;color:#6d6458}
  a#dl{font-size:12px;margin-left:4px;color:#3f6288}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#e9e2d3;color:#5c5448;letter-spacing:.3px;transition:opacity .7s;z-index:9}
  #load.gone{opacity:0;pointer-events:none}
  #keys{position:fixed;right:16px;bottom:16px;background:var(--panel);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:11px;color:#6d6458;
    box-shadow:0 8px 30px rgba(40,30,20,.1);line-height:1.7}
  #keys.hidden{display:none}
  kbd{font:inherit;font-size:10.5px;background:#fff;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:4px;padding:0 4px;color:var(--ink)}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">building the model…</div>

<div id="ui">
  <h1>Austin, miniature</h1>
  <div class="sub">downtown · OpenStreetMap · USGS terrain · TCAD year built</div>

  <div id="yearBig"><span id="yrLabel">2026</span><span id="eraLabel"></span><span id="count"></span></div>

  <div class="row" id="tlRow">
    <button id="play" class="sq">▶</button>
    <input id="yr" type="range" min="1847" max="2026" step="0.5" value="2026">
  </div>
  <div class="row"><label>Speed</label><input id="speed" type="range" min="2" max="40" step="1" value="10">
    <span id="speedLabel" style="font-size:11px;color:var(--dim);width:46px;text-align:right">10 yr/s</span></div>

  <div class="row">
    <div class="seg"><button id="btnTime" class="on">Timeline</button><button id="btnPop">Pop-up</button></div>
    <div class="seg" style="margin-left:auto"><button id="viewMini" class="on">Mini</button><button id="viewIso">Iso</button></div>
  </div>

  <div class="row"><label>Blur</label><input id="blur" type="range" min="0" max="100" value="55"></div>
  <div class="row"><label>Sun</label><input id="sun" type="range" min="0" max="360" value="215"></div>
  <div class="row">
    <label style="flex:0 0 auto">Life</label><input id="life" type="checkbox" checked>
    <label style="flex:0 0 auto">Orbit</label><input id="orbit" type="checkbox">
    <button id="frameAll" style="margin-left:auto">Frame</button>
    <button id="replay">↻</button>
  </div>
  <div class="row"><button id="film">▶ Play the film</button><button id="rec">● Record</button><a id="dl" download="austin-miniature.webm" style="display:none">save</a></div>

  <div class="hint"><b>W A S D</b> move · <b>Q E</b> height · <b>R F</b> tilt · <b>+ −</b> zoom · <b>0</b> frame<br>
    drag orbits · right-drag pans · double-click to fly in · <b>T</b> timeline · <b>H</b> hide</div>
</div>

<script type="module" src="src/main.js"></script>
<script data-goatcounter="https://jesserstrait.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
